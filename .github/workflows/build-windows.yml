name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build application folder
        run: pyinstaller --noconfirm --windowed --onedir --name NEXUS-Network main.py

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Network-Windows
          path: dist/NEXUS-Network/
          if-no-files-found: error
          retention-days: 14
